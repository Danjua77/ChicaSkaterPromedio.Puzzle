<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Escape Room 3D</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <style>
        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body { margin: 0; overflow: hidden; }
        canvas { display: block; width: 100vw !important; height: 100vh !important; }
        #joystick {
            position: fixed;
            left: 10vw;
            bottom: 8vh;
            width: 18vw;
            height: 18vw;
            min-width: 80px;
            min-height: 80px;
            max-width: 140px;
            max-height: 140px;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
            touch-action: none;
            z-index: 10;
        }
        #stick {
            position: absolute;
            left: 35%;
            top: 35%;
            width: 30%;
            height: 30%;
            background: #fff;
            border-radius: 50%;
            touch-action: none;
        }
        #look-joystick {
            position: fixed;
            right: 10vw;
            bottom: 8vh;
            width: 18vw;
            height: 18vw;
            min-width: 80px;
            min-height: 80px;
            max-width: 140px;
            max-height: 140px;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
            z-index: 10;
        }
        #look-stick {
            position: absolute;
            left: 35%;
            top: 35%;
            width: 30%;
            height: 30%;
            background: #fff;
            border-radius: 50%;
            touch-action: none;
        }
        @media (orientation: landscape) {
            #joystick, #look-joystick {
                bottom: 5vh;
                width: 14vw;
                height: 14vw;
                min-width: 70px;
                min-height: 70px;
                max-width: 120px;
                max-height: 120px;
            }
        }
    </style>
</head>
<body>
    <div id="joystick">
        <div id="stick"></div>
    </div>
    <div id="look-joystick" style="position:fixed;right:20px;bottom:20px;width:100px;height:100px;background:rgba(0,0,0,0.2);border-radius:50%;z-index:10;">
        <div id="look-stick" style="position:absolute;left:35px;top:35px;width:30px;height:30px;background:#fff;border-radius:50%;touch-action:none;"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.min.js"></script>
    <script>
        // Configuración básica de Three.js
        let scene = new THREE.Scene();
        let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        let renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Piso
        let floorGeometry = new THREE.PlaneGeometry(20, 20);
        let floorMaterial = new THREE.MeshStandardMaterial({ color: 0x888888 });
        let floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Paredes
        let wallMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
        let wall1 = new THREE.Mesh(new THREE.BoxGeometry(20, 5, 0.5), wallMaterial);
        wall1.position.set(0, 2.5, -10);
        scene.add(wall1);
        let wall2 = wall1.clone(); wall2.position.set(0, 2.5, 10); scene.add(wall2);
        let wall3 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 5, 20), wallMaterial);
        wall3.position.set(-10, 2.5, 0); scene.add(wall3);
        let wall4 = wall3.clone(); wall4.position.set(10, 2.5, 0); scene.add(wall4);

        // Puerta (objeto interactivo)
        let doorMaterial = new THREE.MeshStandardMaterial({ color: 0x663300 });
        let door = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 0.2), doorMaterial);
        door.position.set(0, 1.5, -9.75);
        scene.add(door);

        // Luz
        let light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(0, 10, 0);
        scene.add(light);

        camera.position.set(0, 2, 8);

        // Animación
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Colisiones con muros
        function checkCollision(x, z) {
            const margin = 1.1;
            if (x < -10 + margin) return true;
            if (x > 10 - margin) return true;
            if (z < -10 + margin) return true;
            if (z > 10 - margin) return true;
            return false;
        }

        let cameraYaw = 0;
        let cameraPitch = 0;

        function updateCameraRotation() {
            camera.rotation.order = 'YXZ';
            camera.rotation.y = cameraYaw;
            camera.rotation.x = cameraPitch;
        }

        // Controles básicos con teclado y colisión
        document.addEventListener('keydown', function(event) {
            const speed = 0.3;
            let nx = camera.position.x;
            let nz = camera.position.z;
            let forward = getForwardVector();
            let right = getRightVector();
            if(event.key === 'w') {
                nx += forward.x * speed;
                nz += forward.z * speed;
            }
            if(event.key === 's') {
                nx -= forward.x * speed;
                nz -= forward.z * speed;
            }
            if(event.key === 'a') {
                nx -= right.x * speed;
                nz -= right.z * speed;
            }
            if(event.key === 'd') {
                nx += right.x * speed;
                nz += right.z * speed;
            }
            if(!checkCollision(nx, nz)) {
                camera.position.x = nx;
                camera.position.z = nz;
            }
        });

        // Joystick móvil
        let joystick = document.getElementById('joystick');
        let stick = document.getElementById('stick');
        let dragging = false, startX = 0, startY = 0, dx = 0, dy = 0;
        let moveInterval;
        joystick.addEventListener('touchstart', function(e) {
            dragging = true;
            let touch = e.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
            stick.style.transition = 'none';
        });
        joystick.addEventListener('touchmove', function(e) {
            if (!dragging) return;
            let touch = e.touches[0];
            dx = touch.clientX - startX;
            dy = touch.clientY - startY;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > 40) {
                dx = dx * 40 / dist;
                dy = dy * 40 / dist;
            }
            stick.style.transform = `translate(${dx}px,${dy}px)`;
            if (!moveInterval) {
                moveInterval = setInterval(() => {
                    let speed = 0.15;
                    let forward = getForwardVector();
                    let right = getRightVector();
                    let nx = camera.position.x + (right.x * dx/40 + forward.x * -dy/40) * speed;
                    let nz = camera.position.z + (right.z * dx/40 + forward.z * -dy/40) * speed;
                    if(!checkCollision(nx, nz)) {
                        camera.position.x = nx;
                        camera.position.z = nz;
                    }
                }, 16);
            }
        });
        joystick.addEventListener('touchend', function() {
            dragging = false;
            stick.style.transition = '0.2s';
            stick.style.transform = 'translate(0,0)';
            clearInterval(moveInterval);
            moveInterval = null;
            dx = dy = 0;
        });

        // Joystick para mirar
        let lookJoystick = document.getElementById('look-joystick');
        let lookStick = document.getElementById('look-stick');
        let lookDragging = false, lookStartX = 0, lookStartY = 0, lookDx = 0, lookDy = 0;
        lookJoystick.addEventListener('touchstart', function(e) {
            lookDragging = true;
            let touch = e.touches[0];
            lookStartX = touch.clientX;
            lookStartY = touch.clientY;
            lookStick.style.transition = 'none';
        });
        lookJoystick.addEventListener('touchmove', function(e) {
            if (!lookDragging) return;
            let touch = e.touches[0];
            lookDx = touch.clientX - lookStartX;
            lookDy = touch.clientY - lookStartY;
            let dist = Math.sqrt(lookDx*lookDx + lookDy*lookDy);
            if (dist > 40) {
                lookDx = lookDx * 40 / dist;
                lookDy = lookDy * 40 / dist;
            }
            lookStick.style.transform = `translate(${lookDx}px,${lookDy}px)`;
            // Sensibilidad
            cameraYaw -= lookDx * 0.005;
            cameraPitch -= lookDy * 0.005;
            cameraPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraPitch));
            updateCameraRotation();
            lookStartX = touch.clientX;
            lookStartY = touch.clientY;
        });
        lookJoystick.addEventListener('touchend', function() {
            lookDragging = false;
            lookStick.style.transition = '0.2s';
            lookStick.style.transform = 'translate(0,0)';
            lookDx = lookDy = 0;
        });
        // Mouse para mirar (opcional en PC)
        let mouseLook = false, lastMouseX = 0, lastMouseY = 0;
        document.addEventListener('mousedown', function(e) {
            if (e.target === renderer.domElement) {
                mouseLook = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        document.addEventListener('mousemove', function(e) {
            if (!mouseLook) return;
            let dx = e.clientX - lastMouseX;
            let dy = e.clientY - lastMouseY;
            cameraYaw -= dx * 0.005;
            cameraPitch -= dy * 0.005;
            cameraPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraPitch));
            updateCameraRotation();
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });
        document.addEventListener('mouseup', function() { mouseLook = false; });

        // Modificar controles para moverse en la dirección de la cámara
        function getForwardVector() {
            return new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
        }
        function getRightVector() {
            return new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));
        }

        // Interacción con la puerta
        document.addEventListener('keydown', function(event) {
            if(event.key === 'e') {
                if(Math.abs(camera.position.z + 9.75) < 2 && Math.abs(camera.position.x) < 2) {
                    door.rotation.y -= Math.PI/2;
                    setTimeout(()=>{
                        alert('¡Has escapado!');
                    }, 500);
                }
            }
        });
    </script>
</body>
</html>
