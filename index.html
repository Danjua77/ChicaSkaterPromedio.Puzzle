<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Don Árbolito Sequence</title>
    <!-- Agrega meta viewport para móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #e8f5e9;
            /* Elimina centrado y flex del body */
            width: 100vw;
            min-height: 100vh;
            box-sizing: border-box;
        }
        body {
            /* Elimina flex y centrado */
            width: 100vw;
            min-height: 100vh;

            /* Haz la animación de fade-in más rápida */
            opacity: 0;
            transition: opacity 1.5s cubic-bezier(.77,0,.18,1);
        }
        body.fade-in {
            opacity: 1;
        }
        .arbol-chan-container {
            /* Haz que ocupe toda la pantalla y se fije */
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: url('Fondo texto.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: none;
            border-radius: 0;
            overflow: auto;
            /* Elimina max/min width/height */
        }
        .arbol-chan-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 92vw;
            max-width: 400px;
            margin: 0 auto;
            padding: 2.5vh 0 2.5vh 0;
            /* Quitar fondo, borde y sombra */
            background: none;
            border-radius: 0;
            box-shadow: none;
        }
        /* Imagen baja desde arriba */
        .arbol-chan-img {
            width: 44vw;
            max-width: 180px;
            min-width: 90px;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            opacity: 0;
            transition: opacity 1.2s, transform 1.2s cubic-bezier(.77,0,.18,1);
            transform: translateY(-120px);
        }
        .arbol-chan-img.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .arbol-chan-titulo {
            font-family: 'Montserrat', Arial, sans-serif;
            color: #178a2c;
            font-size: 2rem;
            font-weight: bold;
            margin-top: 0.7rem;
            margin-bottom: 0.5rem;
            text-align: center;
            text-shadow: 0 2px 12px #fff, 0 0 12px #178a2c, 2px 2px 0 #fff;
        }
        .arbol-chan-texto {
            color: #fff;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 1.05rem;
            margin-top: 0.3rem;
            margin-bottom: 1rem;
            text-align: center;
            text-shadow: 0 2px 8px #000;
        }
        .btn-continuar {
            margin-top: 0.3rem;
            font-size: 1.1rem;
            background: #178a2c;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 0.6rem 2rem;
            font-weight: bold;
            font-family: 'Montserrat', Arial, sans-serif;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
        }
        .btn-continuar:active {
            background: #176d13;
            border: 2px solid #ffe44d;
        }
        /* Pong styles (copiados tal cual del flujo original) */
        #pong-container {
            /* Centrado absoluto vertical y horizontal */
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: url('fonde mesa.jpg') no-repeat center center, linear-gradient(180deg, #e8f5e9 0%, #178a2c 100%);
            background-size: cover;
            /* Elimina cualquier margen/padding extra */
            margin: 0;
            padding: 0;
        }
        #pong-canvas {
            background: transparent;
            display: block;
            margin: 0; /* Elimina auto para evitar desplazamiento */
            width: 92vw;
            height: 70vh;
            max-width: 370px;
            max-height: 620px;
            aspect-ratio: 9/16;
            border-radius: 18px;
            box-shadow: 0 0 32px 4px #178a2c88, 0 0 0 4px #178a2c;
            touch-action: none;
        }
        #pong-end {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: url('Fondo texto.jpg') no-repeat center center;
            background-size: cover;
            color: #178a2c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            font-family: 'Montserrat', Arial, sans-serif;
        }
        #pong-end .arbol-img {
            width: 38vw;
            max-width: 180px;
            min-width: 90px;
            margin-top: 2.5rem;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 4px 16px #fff);
        }
        #pong-end h2 {
            font-size: 2.2rem;
            margin-bottom: 2rem;
            color: #178a2c;
            text-align: center;
            text-shadow: 0 2px 12px #fff, 0 0 12px #178a2c, 2px 2px 0 #fff;
            margin-top: 0;
        }
        #pong-next-img {
            width: 60vw;
            max-width: 300px;
            min-width: 120px;
            height: 180px;
            background: #fff;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px #178a2c33;
        }
        #pong-end button {
            font-size: 1.3rem;
            background: #178a2c;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 0.7rem 2.5rem;
            font-weight: bold;
            font-family: 'Montserrat', Arial, sans-serif;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            cursor: pointer;
            margin-top: 1.5rem;
            margin-bottom: 2rem;
        }
        #pong-end button:active {
            background: #176d13;
            border: 2px solid #ffe44d;
        }
    </style>
</head>
<body>
    <div class="arbol-chan-container" id="arbol-chan-container">
        <div class="arbol-chan-content">
            <img src="Skategirl.png" class="arbol-chan-img" id="arbol-chan-img" alt="Skate-girl" />
            <div class="arbol-chan-titulo" id="arbol-chan-titulo">Chica Skater Promedio</div>
            <div class="arbol-chan-texto" id="arbol-chan-texto">
                Ugh… ¿otra persona queriendo una pista? <br>Qué estrés. En fin.
            </div>
            <button class="btn-continuar" id="btn-continuar">Continuar</button>
        </div>
    </div>
    <script>
        // Animación de entrada de Don Árbol
        const arbolChanImg = document.getElementById('arbol-chan-img');
        setTimeout(() => {
            arbolChanImg.classList.add('visible');
        }, 800);

        // Elimina los fade-in para título, texto y botón
        /*
        setTimeout(() => {
            document.getElementById('arbol-chan-titulo').classList.add('visible');
        }, 1100);
        setTimeout(() => {
            document.getElementById('arbol-chan-texto').classList.add('visible');
        }, 1300);
        setTimeout(() => {
            document.getElementById('btn-continuar').classList.add('visible');
        }, 1500);
        */

        // Agrega la clase fade-in al cargar la página para el efecto lento
        window.addEventListener('DOMContentLoaded', function() {
            document.body.classList.add('fade-in');
        });

        // Secuencia de diálogo y juego de ping pong
        let arbolChanDialogStep = 0;
        const arbolChanTexto = document.getElementById('arbol-chan-texto');
        const btnContinuar = document.getElementById('btn-continuar');
        btnContinuar.addEventListener('click', function() {
            if (arbolChanDialogStep === 0) {
                arbolChanTexto.innerHTML = "Soy tu última prueba para encontrar el caché. Literal #FinalBoss.";
                arbolChanDialogStep = 1;
            } else if (arbolChanDialogStep === 1) {
                arbolChanTexto.innerHTML = "Si quieres la siguiente pista, memoriza el patrón de mis latas de Monster...<br>o dile a tu mamá que los niños grandes no te quieren dar la pista😂.";
                arbolChanDialogStep = 2;
            } else {
                // Reemplaza el juego de pong por el juego de memoria 4x4
                document.body.innerHTML = `
<style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f0f0f0; margin-top: 20px; }
    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
    }
    #game-board { display: grid; grid-template-columns: repeat(4, 60px); grid-gap: 10px; justify-content: center; margin: 40px 0 20px 0; }
    .square {
        width: 60px; height: 60px; background: #ccc; border-radius: 8px; display: inline-block; transition: background 0.2s;
    }
    .square.active-green { background: #3ec46d; }
    .square.active-blue { background: #3e7ec4; }
    .square.active-purple { background: #a23ec4; }
    #level { font-size: 1.2em; margin: 20px 0 0 0; }
    #start-btn { padding: 10px 20px; font-size: 1em; margin-bottom: 20px; }
</style>
<div class="container">
    <div id="level">Nivel: 1/???</div>
    <div id="game-board"></div>
    <button id="start-btn">Comenzar</button>
</div>
`;
                // Lógica del juego de memoria directamente aquí
                const board = document.getElementById('game-board');
                const startBtn = document.getElementById('start-btn');
                const levelDisplay = document.getElementById('level');
                let sequence = [];
                let userStep = 0;
                let level = 1;
                let acceptingInput = false;

                function getColorClass(level) {
                    if (level <= 2) return 'active-green';
                    if (level <= 4) return 'active-blue';
                    return 'active-purple';
                }

                function createBoard() {
                    board.innerHTML = '';
                    for (let i = 0; i < 16; i++) {
                        const sq = document.createElement('div');
                        sq.classList.add('square');
                        sq.dataset.index = i;
                        sq.addEventListener('click', handleSquareClick);
                        board.appendChild(sq);
                    }
                }

                function nextSequence() {
                    sequence = [];
                    for (let i = 0; i < level + 2; i++) {
                        sequence.push(Math.floor(Math.random() * 16));
                    }
                }

                function showSequence() {
                    acceptingInput = false;
                    let i = 0;
                    const colorClass = getColorClass(level);
                    const interval = setInterval(() => {
                        if (i > 0) {
                            board.children[sequence[i-1]].classList.remove(colorClass);
                        }
                        if (i < sequence.length) {
                            board.children[sequence[i]].classList.add(colorClass);
                            i++;
                        } else {
                            clearInterval(interval);
                            setTimeout(() => {
                                board.querySelectorAll('.square').forEach(sq => sq.classList.remove(colorClass));
                                acceptingInput = true;
                                userStep = 0;
                            }, 400);
                        }
                    }, 600);
                }

                function handleSquareClick(e) {
                    if (!acceptingInput) return;
                    const idx = Number(e.target.dataset.index);
                    const colorClass = getColorClass(level);
                    if (idx === sequence[userStep]) {
                        e.target.classList.add(colorClass);
                        setTimeout(() => e.target.classList.remove(colorClass), 200);
                        userStep++;
                        if (userStep === sequence.length) {
                            level++;
                            if (level > 6) {
                                mostrarPistaFinal();
                                return;
                            }
                            levelDisplay.textContent = 'Nivel: ' + level + '/???';
                            setTimeout(startLevel, 800);
                        }
                    } else {
                        alert('¡Fallaste! Intenta de nuevo.');
                        level = 1;
                        levelDisplay.textContent = 'Nivel: ' + level + '/???';
                        setTimeout(startLevel, 800);
                    }
                }

                function startLevel() {
                    createBoard();
                    nextSequence();
                    showSequence();
                }

                startBtn.addEventListener('click', () => {
                    level = 1;
                    levelDisplay.textContent = 'Nivel: ' + level + '/???';
                    startLevel();
                });

                createBoard();

                function mostrarPistaFinal() {
                    document.body.innerHTML = `
                        <div class='arbol-chan-container' id='pong-end' style='position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:10;background:url(Fondo texto.jpg) no-repeat center center;background-size:cover;display:flex;flex-direction:column;justify-content:center;align-items:center;'>
                            <div class='arbol-chan-content' style='background:none;box-shadow:none;'>
                                <img src='DonArbolito.png' class='arbol-chan-img' alt='Don Árbol' style='opacity:1;transform:none;margin-bottom:0.7rem;' />
                                <div class='arbol-chan-titulo' style='color:#178a2c;margin-bottom:0.7rem;'>Don Árbolito</div>
                                <div class='arbol-chan-texto' style='color:#fff;'>
                                    ¡Excelente memoria, noble usuario!<br>
                                    Como prometí, le concederé una pista, la cual que es una foto tomada en este parque.<br><br>
                                    Busca el lugar, observa con atención... y encuentra el código.<br>
                                    Y recuerde nunca rendirse.
                                </div>
                                <button id='pong-show-clue' class='btn-continuar' style='margin-top:1.2rem;'>Ver pista</button>
                            </div>
                        </div>
                    `;
                    document.getElementById('pong-show-clue').onclick = function() {
                        document.getElementById('pong-end').innerHTML = `
                            <h2 style='margin-top:0;'>Siguiente pista</h2>
                            <div id='pong-next-img' style='margin:0; padding:0;'>
                                <img src='gym.jpeg' alt='Pista' style='width:100%;height:100%;object-fit:cover;display:block;border-radius:12px 12px 12px 12px;'>
                            </div>
                            <button id='pong-continue' style='font-size:1.3rem;background:#178a2c;color:#fff;border:2px solid #fff;border-radius:8px;padding:0.7rem 2.5rem;font-weight:bold;font-family:Montserrat,Arial,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,0.12);cursor:pointer;margin-top:1.5rem;margin-bottom:2rem;'>Continuar</button>
                        `;
                        document.getElementById('pong-continue').onclick = function() {
                            window.location.href = 'https://danjua77.github.io/Sagrado.Puzzle/';
                        };
                    };
                }
            }
        });
    </script>
</body>
</html>
